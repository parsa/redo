[workspace]
members = ["redo_core", "bins"]
resolver = "2"

[workspace.package]
version = "0.42.0"
edition = "2021"
license = "BSL-1.0"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
nix = { version = "0.29", features = ["process", "signal", "poll", "fs"] }
pathdiff = "0.2"
sha1 = "0.10"
once_cell = "1.19"

